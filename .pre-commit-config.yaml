# Based on the installed machine security template.
# The Semgrep adapter works on Linux and on Windows through the installed WSL route.
repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (secrets in staged diff)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false

      - id: bandit
        name: bandit (Python SAST, medium+ severity)
        entry: bandit -q -ll
        language: system
        types: [python]

      - id: semgrep-wsl
        name: semgrep p/security-audit (native or WSL)
        entry: python tools/semgrep_platform.py config/security-tooling.json
        language: system
        types: [text]
