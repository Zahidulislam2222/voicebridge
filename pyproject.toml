[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebridge-core"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.2", "pydantic-settings==2.15.0", "sqlalchemy==2.1.3",
  "alembic==1.20.0", "psycopg[binary]==3.3.6", "httpx==0.28.1",
  "uvicorn==0.54.0", "pypdf==6.19.0",
  "Authlib==1.8.0", "joserfc==1.7.5", "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0", "types-Authlib==1.8.0.20260911", "bandit==1.9.4", "build==1.6.1", "mcp==2.3.0", "httpx2==2.13.1", "pip-audit==2.10.1"]

[project.scripts]
voicebridge = "voicebridge.cli:main"

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/voicebridge"]
